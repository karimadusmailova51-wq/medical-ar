<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Виртуальная Медсестра</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --med-blue: #007bff;

            --white: #ffffff;

            --text-gray: #333;
        }

        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            background-color: #f0f4f8;

            overflow: hidden;
        }

        /* Шапка */
        .header {
            background: var(--med-blue);
            color: white;
            padding: 10px;
            text-align: center;

            z-index: 10;
            position: relative;
        }

        /* 3D Окно */
        model-viewer { 

            width: 100vw; 
            height: 100vh;

            position: absolute;
            top: 0;
            left: 0;
        }

        /* Контейнер для кнопок и текста внутри AR */
        .controls {
            position: absolute;
            bottom: 30px; /* Опустим пониже к пальцам */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 9999; /* Поверх всего! */
        }

        #start-voice-btn {
            background: #ff4757; /* Красный цвет - его нельзя не заметить */
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.5);
            pointer-events: auto;
            cursor: pointer;
            -webkit-appearance: none; /* Убираем стандартные стили Apple */
        }

        /* Облачко ответа */
        #response-text {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-gray);
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            pointer-events: auto;
            width: 100%;
            text-align: center;
        }

        /* Синяя кнопка для iPhone/Android */
        #start-voice-btn {
            background: var(--med-blue);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            cursor: pointer;

        }

        /* Кнопка входа в AR */
        .ar-button {
            background: white;
            color: var(--med-blue);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            position: absolute;
            top: 60px;
            right: 20px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size:16px;">Виртуальная Медсестра</h1>
</div>

<model-viewer 
    id="nurse-model" 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 

    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1" 
    autoplay 
    animation-name="Idle">

    <button slot="ar-button" class="ar-button">📦 Поставить в комнате</button>

    <div slot="content" class="controls">
        <div id="response-text"></div>
        <button id="start-voice-btn">🎤 Начать разговор</button>
    </div>
</model-viewer>

<script>
// --- 1. ПЕРЕМЕННЫЕ ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = SpeechRecognition ? new SpeechRecognition() : null;
const responseBox = document.getElementById('response-text');
const startBtn = document.getElementById('start-voice-btn');
const modelViewer = document.querySelector('#nurse-model');

// --- 2. НАСТРОЙКА МИКРОФОНА ---
if (recognition) {
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;

    recognition.onstart = () => {
        window.speechSynthesis.cancel();
        responseBox.style.display = 'block';
        responseBox.innerText = "🎤 Слушаю вас...";
        startBtn.style.display = 'none'; // Скрываем кнопку, пока слушаем
    };

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        askAI(transcript);
    };

    recognition.onerror = (err) => {
        console.error("Ошибка:", err.error);
        startBtn.style.display = 'block';
        startBtn.innerText = "Попробовать снова";
    };

    recognition.onend = () => {
        // Если ничего не ответили, возвращаем кнопку через 2 сек
        setTimeout(() => {
            if (responseBox.innerText === "🎤 Слушаю вас...") {
                startBtn.style.display = 'block';
                startBtn.innerText = "🎤 Начать разговор";
            }
        }, 2000);
    };
}

// --- 3. ЛОГИКА КНОПКИ (ДЛЯ IPHONE) ---
startBtn.onclick = () => {
    // Разблокировка звука для iOS
    if (window.AudioContext || window.webkitAudioContext) {
        const audioCtx = new (window.AudioContext || window.webkitwebkitAudioContext)();
        audioCtx.resume();
    }

    if (recognition) {
        try {
            recognition.start();
            startBtn.innerText = "🎤 Слушаю...";
            startBtn.style.background = "#2ed573"; // Зеленый, когда слушает
        } catch(e) {
            console.log("Ошибка старта:", e);
            // Если уже запущено, просто пробуем еще раз
            recognition.stop();
            setTimeout(() => recognition.start(), 100);
        }
    } else {
        alert("Голос не поддерживается");
    }
};

// --- 4. РАБОТА С НЕЙРОСЕТЬЮ ---
async function askAI(question) {
    if (!question) return;
    const API_KEY = "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";

    responseBox.innerText = 'Медсестра думает...';
    
    try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + API_KEY,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                "model": "openrouter/auto",
                "messages": [{ "role": "user", "content": "Ты медсестра. Ответь кратко на русском: " + question }]
            })
        });

        const data = await response.json();
        const aiResponse = data.choices[0].message.content;
        responseBox.innerText = aiResponse;
        speak(aiResponse);
    } catch (err) {
        responseBox.innerText = 'Ошибка связи. Проверьте интернет.';
        startBtn.style.display = 'block';
    }
}

// --- 5. ОЗВУЧКА ---
function speak(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';

    utterance.onend = () => {
        // После того как медсестра ответила, возвращаем кнопку
        startBtn.style.display = 'block';
        startBtn.innerText = "🎤 Спросить еще раз";
    };

    window.speechSynthesis.speak(utterance);
}


</script>
</body>
</html>
