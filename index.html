<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Виртуальная Медсестра</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f4f8; height: 100vh; overflow: hidden; }
        .header { background: #007bff; color: white; padding: 15px; text-align: center; position: relative; z-index: 10; }
        
        /* Исправляем наслоение моделей */
        #container { position: relative; width: 100vw; height: calc(100vh - 60px); }
        model-viewer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .controls { 
            position: absolute; 
            bottom: 40px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 85%; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
        }
        #response-text { 
            background: white; 
            padding: 15px; 
            border-radius: 15px; 
            margin-bottom: 10px; 
            display: none; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            text-align: center;
            font-size: 16px;
        }
        #talk-btn { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 20px; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }
        .active { background: #ff4757 !important; }
    </style>
</head>
<body>

<div class="header"><h1>Виртуальная Медсестра</h1></div>

<div id="container">
    <model-viewer id="nurse-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" ar camera-controls autoplay animation-name="Idle"></model-viewer>
    
    <div class="controls">
        <div id="response-text"></div>
        <button id="talk-btn" type="button">🎤 Спросить астронавта</button>
    </div>
</div>

<script>
    const talkBtn = document.getElementById('talk-btn');
    const responseBox = document.getElementById('response-text');
    const modelViewer = document.getElementById('nurse-model');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.interimResults = false;

        recognition.onstart = () => {
            talkBtn.innerText = "🛑 Слушаю...";
            talkBtn.classList.add('active');
            responseBox.style.display = 'block';
            responseBox.innerText = "Говорите...";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            askAI(transcript);
        };

        recognition.onend = () => {
            talkBtn.innerText = "🎤 Спросить медсестру";
            talkBtn.classList.remove('active');
        };

        recognition.onerror = () => {
            talkBtn.innerText = "🎤 Ошибка. Повторите";
            talkBtn.classList.remove('active');
        };
    }

    talkBtn.onclick = (e) => {
        e.preventDefault(); // Дополнительная защита от перезагрузки
        
        // Разблокировка звука
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (recognition) {
            try {
                recognition.start();
            } catch (err) {
                recognition.stop();
            }
        }
    };

    async function askAI(question) {
        if (!question || question.trim().length === 0) return;

        const API_KEY = "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";
        responseBox.style.display = 'block';
        responseBox.innerText = 'Медсестра думает...';

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + API_KEY.trim(),
                    "HTTP-Referer": window.location.href, // Важно для OpenRouter
                    "X-Title": "Virtual Nurse Assistant" // Важно для OpenRouter
                },
                body: JSON.stringify({
                    // Замени старую строку на эту:
// Самый надежный вариант: ИИ сам найдет работающую бесплатную модель
"model": "openrouter/auto",
                    "messages": [
                        { "role": "system", "content": "Ты медсестра. Отвечай очень кратко на русском (1-2 предложения)." },
                        { "role": "user", "content": question }
                    ]
                })
            });

            const data = await response.json();
            
            // Если сервер вернул ошибку в самом JSON
            if (data.error) {
                console.error("Ошибка API:", data.error);
                responseBox.innerText = "Ошибка ИИ: " + (data.error.message || "Доступ ограничен");
                return;
            }

            if (data.choices && data.choices.length > 0) {
                const answer = data.choices[0].message.content;
                responseBox.innerText = answer;
                speak(answer);
            } else {
                responseBox.innerText = "Ошибка: ИИ прислал пустой ответ.";
            }
        } catch (err) {
            console.error("Ошибка сети:", err);
            responseBox.innerText = "Ошибка связи. Проверьте интернет.";
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ru-RU';
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
